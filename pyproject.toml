[project]
name = "adaptiveops-agent"
version = "0.1.0"
description = "AI-powered AdaptiveOps agent for application observability and automated operations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.25.3",
    "azure-monitor-query>=2.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-openai>=1.1.0",
    "langgraph>=1.2.11",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "pytest>=8.3.0",
    "uvicorn>=0.52.4",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=6.0.1",
    "torch>=2.14.0",
    "numpy>=2.5.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
